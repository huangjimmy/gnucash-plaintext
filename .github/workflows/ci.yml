name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.tag }}
    runs-on: ${{ endsWith(matrix.tag, '-arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    # All eleven supported builds, the same eleven `scripts/test-all-versions-parallel.sh`
    # sweeps for the pre-commit gate. Seven of them until `build.sh` learned to
    # take a tag: fedora, arch and openSUSE build from their own Dockerfiles
    # rather than from a `BASE_IMAGE` build-arg, and the matrix knew only the
    # build-arg shape, so a failure only those three would show reached the
    # gate and not CI.
    #
    # The tag is the only column, and the version each carries is not written
    # here at all — `build.sh` prints it from the one table that has it.
    # Spelled into the job names, it was a copy: `ubuntu24` read `GnuCash-49`
    # long after the image moved to 5.5, and nothing printed or checked it.
    #
    # A tag ending `-arm` is that image built and run on an arm64 runner, and
    # `ubuntu24-arm` is the first. It is a column of its own rather than a
    # second dimension because it is one entry, not eleven: what differs by
    # processor is which library a binding resolves to and how a call is made,
    # not what GnuCash does to a book.
    #
    # It is not a duplicate of `ubuntu24`. The engine is loaded from a path
    # holding the processor Debian and Ubuntu put in their library directory,
    # and on x86_64 the one read from `sysconfig` and the one written out are
    # the same string, deduplicated to a single entry — so no x86_64 job can
    # tell the two apart. On arm64 `/usr/lib/aarch64-linux-gnu/gnucash/
    # libgnc-engine.so` is the only entry that resolves, and a written-out
    # `x86_64-linux-gnu` failed the whole suite there with `Could not load
    # libgnc-engine.so` (CLAUDE.md finding 31). The unit tests force the
    # triplet and can say what the list holds; only an arm64 image can say that
    # GnuCash loads from it.
    #
    # The runner's own distribution need not match the tag — the image is built
    # from the tag's own base — so `ubuntu-24.04-arm` running the `ubuntu24`
    # image is GitHub's label happening to agree, not a requirement.
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, debian12, debian11, debian10, ubuntu26, ubuntu24,
              ubuntu22, ubuntu20, fedora41, arch, opensuse, ubuntu24-arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: The image behind this matrix entry
        # `ubuntu24-arm` is this matrix's name for the `ubuntu24` image on an
        # arm64 runner. The scripts know an image by its own tag and build for
        # whatever processor they are run on, so the suffix is dropped for
        # them; the matrix keeps it, because the coverage file and the artifact
        # are named after the entry and two runs of one build may not answer to
        # one name. Written as a step rather than an expression because
        # GitHub's have no way to cut a suffix off a string.
        id: image
        env:
          MATRIX_TAG: ${{ matrix.tag }}
        run: echo "tag=${MATRIX_TAG%-arm}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        # By tag, through the script that knows which Dockerfile and which base
        # image each one means — the same call the sweep and every local build
        # make.
        run: ./scripts/build.sh ${{ steps.image.outputs.tag }}

      - name: Run tests
        # Through `scripts/test.sh`, which is now the one place that decides
        # how the suite is run — the user, the mount, HOME, the coverage file.
        # `scripts/test-all-versions-parallel.sh`, which the pre-commit hook
        # runs, goes through it too.
        #
        # Spelled out here as its own `docker run` it was one of three copies
        # of that recipe, kept in step by nothing: this one had no `--user`, so
        # CI ran as root while every local run ran as the invoking user. Root
        # writes whatever the mode says, so the one test that takes write
        # permission off a directory could not fail here — the gate reported
        # green on every version and CI red on every version.
        #
        # With coverage on, so these runs are also what the union job
        # below adds up. `scripts/test.sh` writes
        # `.coverage-data/.coverage.<tag>`, a name per build, which is what lets
        # separate jobs be combined afterwards without writing over each
        # other. Nothing is gated on it here beyond the build's own figure: the
        # union is the figure that means anything.
        run: GNC_COVERAGE=1 ./scripts/test.sh ${{ steps.image.outputs.tag }}

      - name: Name this run's coverage after the matrix entry
        # `test.sh` names the file after the image it ran, so both `ubuntu24`
        # jobs write `.coverage.ubuntu24`. The artifact upload refuses a name
        # already taken, and the union job downloads with `merge-multiple`,
        # which would keep whichever landed last — one of the two runs gone,
        # silently, from the figure this project gates on. Renaming to the
        # matrix entry is what keeps the two apart, and `coverage combine`
        # still finds it: the union globs `.coverage.*`.
        env:
          MATRIX_TAG: ${{ matrix.tag }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          [ "$MATRIX_TAG" = "$IMAGE_TAG" ] || \
            mv ".coverage-data/.coverage.$IMAGE_TAG" ".coverage-data/.coverage.$MATRIX_TAG"

      - name: Check this build's own coverage
        # A single build is not the union and cannot be. The paths a particular
        # GnuCash takes run on the builds carrying that version and nowhere
        # else, so every build's own report counts another build's code as
        # missed. Measured on 2026-09-16, one build alone reaches 99.04% (arch,
        # ubuntu26) to 99.44% (latest, ubuntu24, fedora41, opensuse) of the tree
        # the eleven together cover whole.
        #
        # Those were all read in one image. This step reports in the build's
        # own, where the denominator is whichever Python parses the tree:
        # arch's data is 14,521 statements in the arch image and 14,603 in the
        # image the union job reports from, both at 99%. So a figure here and
        # the table in docs/issues/T-009 differ in the last place, which is one
        # more reason for the bar to sit clear of them rather than against them.
        #
        # So this bar sits a point below the lowest of those. A new path that
        # only one version runs lowers the other ten legitimately, and failing
        # them for it would be this check punishing the union it exists to
        # protect — while a real regression, a test file that stopped being
        # collected or a command whose body no longer runs, lands far below 98
        # rather than a fraction under 99. The gate that admits nothing is the
        # union job, and it is the one to read when this passes and that fails.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home \
            -e COVERAGE_FILE=/cov/.coverage.${{ matrix.tag }} \
            -v ${{ github.workspace }}/.coverage-data:/cov \
            -v ${{ github.workspace }}:/workspace \
            gnucash-dev:${{ steps.image.outputs.tag }} \
            sh -c "mkdir -p /tmp/home/.local && cd /workspace && \
              python3 -m pip install -e '.[dev]' -q --break-system-packages --user && \
              PATH=/tmp/home/.local/bin:\$PATH coverage report --fail-under=98"
        # Note: --break-system-packages is safe in Docker (isolated environment)

      - name: Keep this build's coverage for the union
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.tag }}
          path: .coverage-data/.coverage.${{ matrix.tag }}
          # The file's name begins with a dot, and v4 leaves hidden files out
          # unless told otherwise — without this the artifact uploads empty and
          # the union job has nothing to combine.
          include-hidden-files: true
          retention-days: 7

      - name: Run deployment test
        run: ./scripts/test-deployment.sh ${{ steps.image.outputs.tag }}

      - name: Run linting
        if: matrix.tag == 'latest'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            gnucash-dev:${{ steps.image.outputs.tag }} \
            sh -c "cd /workspace && \
              python3 -m pip install -e '.[dev]' -q --break-system-packages && \
              ruff check ."
        # Note: --break-system-packages is safe in Docker (isolated environment)

  union-coverage:
    name: Union coverage, every build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Only the image this job combines and reports in. The suites
        # themselves have already run, once each, in the matrix jobs above;
        # nothing is run again here. Before this job existed, another run of
        # the whole `latest` suite happened for the sole purpose of producing a
        # figure one build cannot reach.
        #
        # One of those jobs is the same build on another processor, so the
        # union is over twelve data files and eleven builds. Combining them is
        # sound because coverage is a set of lines reached: the arm64 run of
        # `ubuntu24` reaches what that GnuCash reaches, and the paths only it
        # takes — the engine found under `aarch64-linux-gnu` — are lines of
        # this tree like any other.
        run: ./scripts/build.sh latest

      - name: Collect what every build measured
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .coverage-data

      - name: Gate the union at 100% and the scenarios at their floor
        # The figure this project gates on. A line no supported version reaches
        # is a line nothing tests, and a line no version *can* reach is itself
        # the defect — so the answer is a test or a deletion, never a lower
        # number. `--report-only` combines the eleven files and reports them;
        # the script runs no suite of its own here.
        #
        # The same run gates what `tests/scenario/` alone reaches, against the
        # floor `SCENARIO_THRESHOLD` in scripts/coverage.sh, which may be
        # raised and is not lowered.
        #
        # `touch` changes the timestamps, not the data. The script warns when
        # the source is newer than the coverage data, because a figure measured
        # against a tree that has since changed reads exactly like a current
        # one — and in this job that warning is true by construction and means
        # nothing, since the checkout above writes the whole tree after the
        # matrix jobs wrote their data, from the same commit.
        run: |
          touch .coverage-data/.coverage.*
          ./scripts/coverage.sh --report-only --threshold 100

      - name: Write the union as XML for Codecov
        # Codecov is sent the union, which is what the gate above measures. Sent
        # one build's run instead it reported a figure no part of this project
        # gates on, and the two drifted with every version-specific path added.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home \
            -e COVERAGE_FILE=/cov/.coverage \
            -v ${{ github.workspace }}/.coverage-data:/cov \
            -v ${{ github.workspace }}:/workspace \
            gnucash-dev:latest \
            sh -c "mkdir -p /tmp/home/.local && cd /workspace && \
              python3 -m pip install -e '.[dev]' -q --break-system-packages --user && \
              PATH=/tmp/home/.local/bin:\$PATH coverage xml -o /workspace/coverage.xml"
        # Note: --break-system-packages is safe in Docker (isolated environment)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t gnucash-dev:latest .

      - name: Run ruff check
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            gnucash-dev:latest \
            sh -c "cd /workspace && \
              python3 -m pip install -e '.[dev]' -q --break-system-packages && \
              ruff check ."
        # Note: --break-system-packages is safe in Docker (isolated environment)
