[project]
name = "gnucash-plaintext"
version = "0.4.0"
description = "GnuCash Plaintext - Convert between GnuCash and human-readable plaintext format"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
dependencies = [
    "click>=8.0",
    "ofxparse>=0.21",      # QFX/OFX file parsing
    "beautifulsoup4>=4.9",  # Future QFX parsing alternative
    "lxml>=4.6",            # XML parsing
    "pyyaml>=5.4",          # Configuration file support
    "jinja2>=3.0",          # HTML template rendering for income statement
    "typing_extensions>=4.0; python_version<'3.11'",  # NotRequired, TypedDict backport
]

[project.optional-dependencies]
invoice = [
    # No PDF engine here. A printed invoice or bill is laid out by WebKit,
    # the engine GnuCash itself prints with, and WebKit is not a Python
    # package: it wants the GObject bindings and a WebKit2 typelib from the
    # system (`apt install python3-gi gir1.2-webkit2-4.1`), plus Xvfb where
    # there is no display. `pip` can install none of that.
    "lxml>=4.6",
]
statement = [
    # `income-statement` lays its own page out, that page being this
    # project's rather than GnuCash's, and WeasyPrint is what lays it out.
    # Named apart from `invoice` because installing it does nothing for a
    # printed invoice or bill, which was misleading while the two shared an
    # extra.
    "weasyprint",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "ruff>=0.1.0",  # Linter + formatter (replaces flake8, black, isort)
    "pypdf>=3.0",   # reads a printed PDF's text back, to check it is selectable
]

[project.scripts]
gnucash-plaintext = "cli.main:cli"

[tool.setuptools]
packages = [
    "cli",
    "services",
    "repositories",
    "infrastructure",
    "infrastructure.gnucash",
    "infrastructure.pdf",
    "infrastructure.plaintext",
    "infrastructure.qfx",
    "use_cases",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.html"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default fd-level capture is kept on purpose: it shields pytest's live output
# from GnuCash, which churns file descriptors during a run and intermittently
# closes one. The only fallout is that pytest's capture *teardown* then crashes
# in `os.dup2(saved_fd, 0)` with `OSError: [Errno 9] Bad file descriptor` AFTER
# every test has passed; that teardown is hardened in tests/conftest.py to
# swallow the EBADF. (sys-level capture is NOT used — it routes live output to
# the real fd, so a mid-run close internal-errors pytest, which is worse.)
addopts = "-v --tb=short"

[tool.coverage.run]
# Every layer CLAUDE.md names, including `repositories/` — a package left out
# of `source` is not reported as uncovered, it is not reported at all, so a
# gate at 100% would go green over it.
source = ["cli", "services", "infrastructure", "use_cases", "repositories"]
omit = [
    "tests/*",
    "*/tests/*",
    # The module that lays a page out with WebKit runs as its own
    # process — `python3 -m infrastructure.pdf.webkit_page`, under an X
    # server — so nothing pytest measures ever executes a line of it, and
    # counted it reads as 0% of a file every printed PDF goes through. What
    # exercises it is every `--format pdf` test there is, from the other side
    # of a `subprocess.run`; measuring the parent is what says whether those
    # pass. Left in `source` it would drag the union down while being the
    # best-covered code here by any honest reckoning.
    "*/infrastructure/pdf/webkit_page.py",
]
# Branches as well as lines: an `if` whose false side never runs is a line
# nothing tests, and the line count alone calls it covered.
branch = true
# Each distribution's run is named after the distribution — `COVERAGE_FILE=/cov/
# .coverage.ubuntu20` — so ten of them write into one shared directory at once
# without overwriting each other, and `coverage combine` adds them up. Not
# `parallel = true`: pytest-cov combines a run's own data files into the
# canonical name before it exits, which would leave every container writing
# `/cov/.coverage` over the last one to finish.
# The sweep copies the workspace to a temp directory per distribution, so the
# same module is at a different absolute path in every run. Recorded relative
# to the workspace root, they are the same file and combine into one figure.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py38"  # Minimum supported version (Ubuntu 20.04)

# Exclude files/directories
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    ".venv",
    "venv",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize Python code)
    "B",   # flake8-bugbear (find likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (let formatter handle it)
    "B008",  # Do not perform function calls in argument defaults
    "UP006", # Use dict instead of Dict (requires Python 3.9+, keep 3.8 compatible)
    "UP045", # Don't modernize type hints (keep Python 3.8 compatible)
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports and redefinitions in tests
"tests/*" = ["F401", "F811"]
# Allow star imports in __init__.py
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
# Format strings with double quotes (Python default)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"
# Use Unix line endings
line-ending = "lf"
