# A year-end rate that puts a holding's worth exactly on a half cent.
#
# 1,000.00 USD at 1.386465 is 1386.465 CAD — a figure whose last digit is a
# five with nothing after it, which is the one case where two rounding rules
# disagree. Half-up yields 1386.47; GnuCash converts with GNC-RND-ROUND, which
# rounds a tie to the nearest even and yields 1386.46.
#
# The account line and `total_assets` are GnuCash's own conversion, and the
# gain measured from the cost bases reaches `total_equity`. Worked out with a
# different rule from the one GnuCash used, the two sides of the sheet come to
# different amounts — on the simplest book this feature covers, currency bought
# with the book's own money and nothing spent.
#
# A four-decimal rate reaches it on ordinary holdings too: 1,010.00 USD at
# 1.3865 is 1400.365.
USD/CAD:
  2026-12-31: 1.386465
